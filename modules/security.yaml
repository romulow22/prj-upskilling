#--------------------------------------------------
# Arquivo security.yaml - Firewall - 22 (restrito), 80, 443
#--------------------------------------------------
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Security Group da Infra Code Server

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID da VPC
  SGName:
    Type: String
    Default: WebServer
    Description: Sufixo do nome do Security Group
  SSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR autorizado na porta 22 (recomendado - IP do administrador /32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Informe um CIDR IPv4 válido (ex. 200.10.20.30/32)

Resources:
  #=====================================
  # Security Group - Firewall
  #=====================================
  WebSG:
    Type: AWS::EC2::SecurityGroup

    Properties:
      # Alterar a descrição força a substituição do SG (export em uso pela EC2)
      GroupDescription: Permite SSH
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHCidr
          Description: SSH administrativo (restrito ao CIDR autorizado)

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - redireciona para HTTPS

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS - acesso ao code-server

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Saida liberada (atualizacoes de pacotes e APIs AWS)

      Tags:
        - Key: Name
          Value: !Sub Firewall-${SGName}

Outputs:
  WebSecurityGroupId:
    Description: Id do Firewall
    Value: !Ref WebSG
    Export:
      Name: CodeServer-WebSG
